name: Build VP&S Anatomy Viewer

on:
  workflow_dispatch:

jobs:

  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false

      matrix:
        include:

          - platform: macos-latest
            args: --target aarch64-apple-darwin

          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Node
      # -------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # -------------------------------------------------------
      # Rust
      # -------------------------------------------------------

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable


      # -------------------------------------------------------
      # Rust build cache
      # -------------------------------------------------------

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target


      # -------------------------------------------------------
      # JavaScript dependencies
      # -------------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # -------------------------------------------------------
      # Windows icon diagnostics
      # -------------------------------------------------------

      - name: Debug Windows Tauri icons
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Current directory"
          Write-Host "========================================"

          Get-Location


          Write-Host ""
          Write-Host "========================================"
          Write-Host "Contents of src-tauri/icons"
          Write-Host "========================================"

          if (Test-Path "src-tauri/icons") {

            Get-ChildItem "src-tauri/icons" |
              Format-Table Name, Length, FullName

          } else {

            Write-Host "ERROR: src-tauri/icons does not exist"

          }


          Write-Host ""
          Write-Host "========================================"
          Write-Host "Checking icon.ico"
          Write-Host "========================================"

          if (Test-Path "src-tauri/icons/icon.ico") {

            Write-Host "SUCCESS: icon.ico EXISTS"

            Get-Item "src-tauri/icons/icon.ico" |
              Format-List FullName, Length, Extension

          } else {

            Write-Host "ERROR: icon.ico DOES NOT EXIST"

          }


          Write-Host ""
          Write-Host "========================================"
          Write-Host "Tauri configuration"
          Write-Host "========================================"

          Get-Content "src-tauri/tauri.conf.json"


          Write-Host ""
          Write-Host "========================================"
          Write-Host "Git tracked icon files"
          Write-Host "========================================"

          git ls-files src-tauri/icons


      # -------------------------------------------------------
      # Build application
      # -------------------------------------------------------

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}


      # -------------------------------------------------------
      # Upload finished bundles
      # -------------------------------------------------------

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VP-S-Anatomy-Viewer-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
